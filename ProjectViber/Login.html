        <!-- Login Card -->
        <div class="w-full max-w-[430px] bg-white rounded-2xl shadow-xl shadow-slate-200/60 p-8 border border-gray-100/80 transition-all">
            <!-- Card Header -->
            <div class="mb-6">
                <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Masuk</h1>
                <p class="text-xs text-gray-500 mt-1.5 font-normal">Masukkan NIK dan password untuk melanjutkan.</p>
            </div>

            <!-- Login Form -->
            <form onsubmit="event.preventDefault(); handleLogin();" class="space-y-4" autocomplete="off">

                <!-- Pesan Error -->
                <div id="loginError" role="alert" class="hidden p-3 bg-red-50 border border-red-100 rounded-lg text-xs text-red-600 font-medium"></div>

                <!-- NIK Field -->
                <div>
                    <label for="nik" class="block text-xs font-semibold text-gray-700 mb-1.5">NIK</label>
                    <div class="relative flex items-center">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                            <!-- ID Card Icon -->
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2"></path>
                            </svg>
                        </div>
                        <input
                            type="text"
                            id="nik"
                            name="nik"
                            placeholder="Masukkan NIK"
                            required
                            autocapitalize="off"
                            autocomplete="username"
                            spellcheck="false"
                            class="w-full pl-10 pr-3.5 py-2.5 bg-white border border-gray-200 rounded-lg text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-600/30 focus:border-brand-blue transition-all"
                        >
                    </div>
                </div>

                <!-- Password Field -->
                <div>
                    <label for="password" class="block text-xs font-semibold text-gray-700 mb-1.5">Password</label>
                    <div class="relative flex items-center">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-700">
                            <!-- Bullet Circle Icon -->
                            <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="8"/>
                            </svg>
                        </div>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Masukkan password"
                            required
                            autocomplete="current-password"
                            class="w-full pl-10 pr-24 py-2.5 bg-white border border-gray-200 rounded-lg text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-600/30 focus:border-brand-blue transition-all"
                        >
                        <!-- Show/Hide Toggle Button -->
                        <button
                            type="button"
                            id="togglePassword"
                            onclick="togglePasswordVisibility()"
                            class="absolute right-3.5 text-xs font-medium text-gray-400 hover:text-gray-700 focus:outline-none transition-colors"
                        >
                            Lihat
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="pt-2">
                    <button
                        type="submit"
                        id="submitBtn"
                        class="w-full bg-[#00588A] hover:bg-[#004872] active:bg-[#003B5C] text-white font-medium py-2.5 px-4 rounded-lg text-sm transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#00588A] disabled:opacity-70 disabled:cursor-not-allowed"

            <!-- Info Box -->
            <div class="mt-5 p-3.5 bg-[#EBF3FA] rounded-xl border border-blue-100/60 flex items-center justify-center">
                <p class="text-[11px] text-[#004369] font-normal leading-relaxed text-center">
                    Gunakan NIK yang sudah terdaftar untuk mengakses sistem.

    <!-- Footer Bar -->
    <footer class="w-full bg-[#082545] text-white px-8 py-3.5 flex flex-col sm:flex-row items-center justify-between text-xs font-normal border-t border-navy-900/50">
        <!-- Left Side Info -->
        <div class="flex items-center space-x-3 mb-2 sm:mb-0">
            <span class="font-bold text-red-500 italic">new <span class="text-white font-normal not-italic">armada</span></span>
            <span class="text-gray-500">|</span>
            <span class="text-gray-300 text-[11px]">Portal Internal Section Viber</span>

        <div class="text-gray-400 text-[11px]">

        </div>

    <!-- JavaScript Logic -->
    <script>
        /* =========================================================
           PENGATURAN AKUN
           Tambah akun baru di sini. "redirect" adalah halaman tujuan
           setelah login berhasil. NIK tidak membedakan huruf besar/kecil,
           password membedakan huruf besar/kecil.

           CATATAN: ini hanya untuk simulasi frontend. Password di script
           bisa dilihat siapa pun lewat View Source, jadi ganti dengan
           verifikasi di server (backend) sebelum dipakai sungguhan.
           ========================================================= */
        const ACCOUNTS = [
            {
                nik: 'LT0003',
                password: 'LT123',
                role: 'leader',
                redirect: 'Leader/dashboard-lead.html'
            },
            {
                nik: 'publicdash',
                password: 'public123',
                role: 'public',
                redirect: 'Public/dashboard-public.html'
            }
        ];

        const errorBox = document.getElementById('loginError');

        function showError(message) {
            errorBox.textContent = message;
            errorBox.classList.remove('hidden');
        }

        function hideError() {
            errorBox.classList.add('hidden');
        }

        document.getElementById('nik').addEventListener('input', hideError);
        document.getElementById('password').addEventListener('input', hideError);

        // Toggle Show/Hide Password
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.getElementById('togglePassword');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.textContent = 'Sembunyikan';
            } else {
                passwordInput.type = 'password';
                toggleBtn.textContent = 'Lihat';
            }
        }

        // Login Handler
        function handleLogin() {
            const nik = document.getElementById('nik').value.trim();
            const password = document.getElementById('password').value;

            const account = ACCOUNTS.find(item =>
                item.nik.toLowerCase() === nik.toLowerCase() &&
                item.password === password
            );

            if (!account) {
                showError('NIK atau password salah. Silakan coba lagi.');
                return;
            }

            hideError();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = 'Memproses...';
            submitBtn.disabled = true;

            // Simpan sesi sederhana untuk dibaca halaman tujuan
            try {
                sessionStorage.setItem('sectionViberSession', JSON.stringify({
                    nik: account.nik,
                    role: account.role
                }));
            } catch (e) {}

            setTimeout(() => {
                window.location.href = account.redirect;
            }, 400);
        }
    </script>
</body>
